<script>
        // Micro-interaction for the password visibility toggle
        const toggleBtn = document.querySelector('button[type="button"]');
        const passwordInput = document.getElementById('password');
        const visibilityIcon = toggleBtn.querySelector('.material-symbols-outlined');

        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            visibilityIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        });

        // Add subtle hover lift to input containers
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.closest('.relative').classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.closest('.relative').classList.remove('scale-[1.01]');
            });
        });
    </script>
